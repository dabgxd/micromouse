; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = genericSTM32F411CE
src_dir = src
include_dir = Inc

[env:genericSTM32F411CE] 
platform = ststm32
board = genericSTM32F411CE 
framework = stm32cube

build_flags =
    -I Inc
    -I Drivers/STM32F4xx_HAL_Driver/Inc
    -I Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
    -I Drivers/CMSIS/Device/ST/STM32F4xx/Include
    -I Drivers/CMSIS/Include

upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-14310
monitor_echo = yes
monitor_filters = send_on_enter

; Firmware test linh kiện TẠM THỜI (src/hwtest.c + tools/hwtest_web): pio run -e hwtest -t upload
[env:hwtest]
extends = env:genericSTM32F411CE
build_flags =
    ${env:genericSTM32F411CE.build_flags}
    -D HW_TEST
    -Wl,-u,_printf_float
