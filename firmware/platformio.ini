
; Micromouse – STM32F411CEU6 (Black Pill), PlatformIO + STM32Cube HAL.
;
;   env:main    firmware chính (thi đấu)        pio run -e main -t upload
;   env:hwtest  firmware test phần cứng          pio run -e hwtest -t upload
;               điều khiển bằng tools/hwtest_web (xem ../README.md)
;
; Hai env dùng chung code CubeMX (src/, Inc/) và thư viện driver/điều khiển (lib/).
; Thư mục src/hwtest/ chỉ được build trong env hwtest.

[platformio]
default_envs = main
src_dir = src
include_dir = Inc

[env]
platform = ststm32
board = genericSTM32F411CE
framework = stm32cube
build_flags =
    -I Inc
    -I Drivers/STM32F4xx_HAL_Driver/Inc
    -I Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
    -I Drivers/CMSIS/Device/ST/STM32F4xx/Include
    -I Drivers/CMSIS/Include
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 38400

[env:main]
build_src_filter = +<*> -<hwtest/>

[env:hwtest]
build_src_filter = +<*>
build_flags =
    ${env.build_flags}
    -D HW_TEST
    -Wl,-u,_printf_float
